<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./styles/mobile.css">
  <link rel="stylesheet" media="(min-width: 800px)" href="./styles/desktop.css">
  <title>HTML & CSS RWD</title>
</head>
<body>
    <header class="header row">
      <div class="header__container container">
        <h1 class="header__logo cell"></h1>
        <nav class="header__nav cell"><button class="nav__hamburger"></button></nav>
      </div>
    </header>
    <!-- menu -->
    <main class="row">
      <!-- główna treść -->
       <section class="content__container container">
        <article class="content__article cell"></article>
        <aside class="content__ads cell"></aside>
       </section>
    </main>
    <section class="card row">
      <div class="card__container container">
        <article class="card__article cell"></article>
        <article class="card__article cell"></article>
        <article class="card__article cell"></article>
      </div>
    </section>
   <footer>
        <!-- prawa autorskie -->
         <div class="footer__container container">
            <section class="footer__copyrights cell"></section>
         </div>
   </footer>
</body>
</html>
